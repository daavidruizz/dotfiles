##############################
### WINDOWS AND WORKSPACES ###
##############################

# Suppress maximize requests & XWayland focus issues
windowrulev = suppressevent maximize, class:.*
windowrulev = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# --- System dialogs (por título) ---
windowrulev = float, title:^(NetworkManager)$
windowrulev = center, title:^(NetworkManager)$
windowrulev = size 800 600, title:^(NetworkManager)$

windowrulev = float, title:^(System Monitor)$
windowrulev = center, title:^(System Monitor)$
windowrulev = size 900 700, title:^(System Monitor)$

windowrulev = float, title:^(Disk Usage)$
windowrulev = center, title:^(Disk Usage)$
windowrulev = size 800 600, title:^(Disk Usage)$

windowrulev = float, title:^(Audio Control)$
windowrulev = center, title:^(Audio Control)$
windowrulev = size 600 400, title:^(Audio Control)$

windowrulev = float, title:^(Bluetooth Manager)$
windowrulev = center, title:^(Bluetooth Manager)$
windowrulev = size 500 400, title:^(Bluetooth Manager)$

windowrulev = float, title:^(Calendar)$
windowrulev = center, title:^(Calendar)$
windowrulev = size 600 500, title:^(Calendar)$

windowrulev = float, title:^(Calculator)$
windowrulev = center, title:^(Calculator)$
windowrulev = size 400 500, title:^(Calculator)$

# --- File manager ---
windowrule = match:class ^(thunar)$, float on
windowrule = match:class ^(thunar)$, center on
windowrule = match:class ^(thunar)$, size 1200 800

# --- Generic floating class ---
windowrule = match:class ^(type1-floating)$, float on
windowrule = match:class ^(type1-floating)$, center on
windowrule = match:class ^(type1-floating)$, size 1200 600

# --- File choosers (xdg-desktop-portal-gtk) ---
windowrule = match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Open File)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Open File)$, center on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Open File)$, size 800 600

windowrule = match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Save As)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Save As)$, center on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Save As)$, size 800 600

windowrulev = float,class:(xdg-desktop-portal-gtk)
windowrulev = size 900 650,class:(xdg-desktop-portal-gtk)
windowrulev = center,class:(xdg-desktop-portal-gtk)

# --- Sidepad ---
windowrulev = float,class:(sidepad)
windowrulev = size 1000 700,class:(sidepad)
windowrulev = center,class:(sidepad)
windowrulev = pin,class:(sidepad)

windowrule {
    name = sidepad
    match:class = (sidepad)
    float = true
    pin = true
    center = true
    size = 1000 700
}

# --- Rofi ---
windowrulev = opacity 0.9 0.9,class:(rofi)
windowrulev = blur,class:(rofi)

# --- Web apps (Chrome PWA) ---
windowrule = match:class ^(chrome-calendar\.google\.com.*)$, float on
windowrule = match:class ^(chrome-calendar\.google\.com.*)$, center on
windowrule = match:class ^(chrome-calendar\.google\.com.*)$, size 1400 800

windowrule = match:class ^(chrome-outlook\.live\.com.*)$, float on
windowrule = match:class ^(chrome-outlook\.live\.com.*)$, center on
windowrule = match:class ^(chrome-outlook\.live\.com.*)$, size 1400 800

windowrule = match:class ^(chrome-mail\.google\.com.*)$, float on
windowrule = match:class ^(chrome-mail\.google\.com.*)$, center on
windowrule = match:class ^(chrome-mail\.google\.com.*)$, size 1400 800

# --- Bluetooth ---
windowrule = match:class ^(bluetuith)$, float on
windowrule = match:class ^(bluetuith)$, center on
windowrule = match:class ^(bluetuith)$, opacity 1.0 override
windowrule = match:class ^(bluetuith)$, size 1200 600

# --- Notifications ---
windowrule = match:class ^(Dunst)$, float on

# --- Document viewers ---
windowrule = match:class ^(org\.pwmt\.zathura)$, float on
windowrule = match:class ^(org\.pwmt\.zathura)$, center on
windowrule = match:class ^(org\.pwmt\.zathura)$, size 70% 90%

windowrule = match:class ^(zathura)$, float on
windowrule = match:class ^(zathura)$, center on
windowrule = match:class ^(zathura)$, size 70% 90%

# --- Text editor ---
windowrule = match:class ^(org\.kde\.kwrite)$, float on
windowrule = match:class ^(org\.kde\.kwrite)$, center on
windowrule = match:class ^(org\.kde\.kwrite)$, size 60% 70%

windowrule = match:class ^(kwrite)$, float on
windowrule = match:class ^(kwrite)$, center on
windowrule = match:class ^(kwrite)$, size 60% 70%

# --- Image viewers ---
windowrule = match:class ^(feh)$, float on
windowrule = match:class ^(feh)$, center on
windowrule = match:class ^(feh)$, size 60% 70%

windowrule = match:class ^(imv)$, float on
windowrule = match:class ^(imv)$, center on
windowrule = match:class ^(imv)$, size 60% 70%

# --- Calculator ---
windowrule = match:class ^(qalculate-gtk)$, float on
windowrule = match:class ^(qalculate-gtk)$, center on
windowrule = match:class ^(qalculate-gtk)$, size 400 500
